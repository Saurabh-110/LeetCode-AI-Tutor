<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeetCode AI Tutor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><h1>AI Tutor</h1></header>

  <section class="card" aria-label="Current problem">
    <div class="status-title" id="status-title">Open a LeetCode problem</div>
    <div class="status-line" id="status-line"></div>
    <button id="reset-btn" type="button" hidden>Reset timer</button>
  </section>

  <section class="card" aria-label="Settings">
    <div class="row">
      <label for="enable-toggle">Enable tutor</label>
      <label class="switch">
        <input type="checkbox" id="enable-toggle">
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <label for="timer-select">Remind me after</label>
      <select id="timer-select">
        <option value="5">5 min</option>
        <option value="10">10 min</option>
        <option value="15">15 min</option>
        <option value="20">20 min</option>
        <option value="30">30 min</option>
        <option value="custom">Custom...</option>
      </select>
    </div>
    <div class="row" id="custom-row" hidden>
      <label for="custom-input">Custom (1-180 min)</label>
      <input type="number" id="custom-input" min="1" max="180" step="1">
    </div>
    <p class="hint">Only active time counts: the timer pauses when you switch tabs or leave the window, and each problem has its own clock.</p>
  </section>

  <section class="card" aria-label="Recent problems">
    <div class="row">
      <h2>Recent problems</h2>
      <button id="clear-btn" type="button" class="link" hidden>Clear</button>
    </div>
    <ul id="history" class="history"></ul>
    <p id="history-empty" class="hint">No history yet. It appears after you start working on a problem.</p>
  </section>

  <script src="timer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
